[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "morse-trainer"
version = "0.1.0"
description = "A terminal-based Morse code learning and practice application."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "rich",
]

authors = [
    { name = "Your Name" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
